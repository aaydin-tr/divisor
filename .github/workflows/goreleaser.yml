name: goreleaser

on:
  push:
    # Only v-prefixed tags: the image and chart tag schemes assume vX.Y.Z.
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  # issues: write

jobs:
  linter:
    name: Linter
    uses: ./.github/workflows/linter.yml

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    needs: linter

  goreleaser:
    name: GoReleaser
    needs: [linter, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # dockers_v2 needs goreleaser v2.12 or later.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Publish the Helm chart to GHCR
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          chart_package="$(bash .github/scripts/helm-package-chart.sh "$RELEASE_TAG" dist/chart)"
          helm push "$chart_package" oci://ghcr.io/aaydin-tr/charts
