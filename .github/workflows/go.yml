# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]

jobs:

  # Runs the integration suite on main and, importantly, seeds the buildx
  # type=gha layer cache from the base branch: caches written by PR runs are
  # scoped to that PR, so without this a fresh PR's first Integration run
  # would always miss the cache.
  integration:
    name: Integration
    uses: ./.github/workflows/integration.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: "1.25.3"

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
