name: Integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"

      - name: Run integration suite
        env:
          DIVISOR_INTEGRATION: "1"
        run: go -C integration-test test -v -timeout 20m .
