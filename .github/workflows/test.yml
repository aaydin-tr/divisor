name: Test

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27.3"

      - name: Test
        run:  go test -race -v ./...

      # The benchmark is its own Go module, which the root ./... never reaches.
      - name: Test the benchmark module
        run: go -C benchmark test -race -v ./...
