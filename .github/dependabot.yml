# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /benchmark
    schedule:
      interval: weekly

  # The Release benchmark's Contender and oha pins. contenders/divisor is the image under
  # test, and backend/ and equivalentsetup/ move with the Go toolchain bump.
  - package-ecosystem: docker
    directories:
      - /benchmark/contenders/haproxy
      - /benchmark/contenders/nginx
      - /benchmark/contenders/traefik
      - /benchmark/loadgenerator
    schedule:
      interval: monthly
    groups:
      benchmark-pins:
        patterns:
          - "*"
