# IP-Hash Configuration
# Use Case: Client affinity - each client IP routes to one backend while the
# set of healthy backends stays the same. A client loses state kept on its
# backend when that backend goes down; see "Choosing the Right Algorithm" in
# examples/README.md

type: ip-hash
port: 8000
host: localhost

health_checker_time: 30s

backends:
  # Client IP determines which backend handles the request
  # Same IP always goes to same backend (as long as it's healthy)
  - url: session-server-1:8080
    health_check_path: /health

  - url: session-server-2:8080
    health_check_path: /health

  - url: session-server-3:8080
    health_check_path: /health

  - url: session-server-4:8080
    health_check_path: /health

monitoring:
  port: 8001
  host: localhost

# Track which backend each client is routed to
custom_headers:
  x-client-ip: $remote_addr

server:
  http_version: http1

  # Longer timeouts for session-based applications
  idle_timeout: 300s
  disable_keepalive: false
