type: round-robin # The Balancer: round-robin, w-round-robin, ip-hash, random, least-connection or least-response-time. Default: round-robin
port: 8000 # Port divisor listens on for clients. Required
host: 0.0.0.0 # Address divisor listens on for clients. Default: 0.0.0.0 (accepts outside traffic; the Monitoring server stays on localhost by default)
health_checker_time: 30s # Interval between Probe rounds; each round Probes every Backend, Alive and Down. 0 or negative means the default. Default: 30 seconds
health_checker_timeout: 5s # Bound on each Probe as a whole (connect, send, answer). 0 means the default; negative is a startup error. Default: 5 seconds
backends:
  - url: localhost:8080 # Backend address, host:port; an optional http:// is stripped, https://, a path or a query is a startup error
    health_check_path: /health # Path each Probe requests with a GET; redirects are not followed. Default: /
    # health_check_status: 204 # Exact status a Probe must answer (200-599); any other status is a failed Probe. Default: unset, any 2xx or 3xx keeps the Backend Alive
    weight: 2 # Share of traffic under w-round-robin, which requires a positive weight on every Backend; other Balancers ignore it
    max_conn: 512 # Max connections divisor opens to this Backend; an open Streamed response holds one. 0 or negative means the default. Default: 512
    max_conn_timeout: 30s # How long a request waits for a free connection when all max_conn are busy. 0 or negative means the default. Default: 30 seconds
    max_conn_duration: 10s # A connection to the Backend is closed once it has been open this long. 0 or negative means the default. Default: 10 seconds
    max_idle_conn_duration: 10s # An idle connection to the Backend is closed after this long. 0 or negative means the default. Default: 10 seconds
    max_idemponent_call_attempts: 5 # Attempts, the first included, for an idempotent request whose connection fails (the key is spelled idemponent). Default: 5
monitoring:
  port: 8001 # Monitoring server port. Default: 8001
  host: localhost # Monitoring server address; set 0.0.0.0 when an orchestrator probes /healthz and /ready from outside the host. Default: localhost
logging:
  format: json # Application log encoding on stderr; json or console. Default: json
  level: info # Minimum Application log level; debug, info, warn, error, dpanic, panic or fatal. Default: info
  access_log: false # One JSON line per answered request on stdout (always JSON). Default: false
custom_headers: # Headers set on every request sent to a Backend, replacing a same-named client header. Any header name; the value must be one of the four special variables below
  x-client-ip: $remote_addr # The Client IP, the TCP peer that connected to divisor
  x-req-time: $time # The request time, UTC RFC 3339 with milliseconds
  x-incremental-id: $incremental # The Request sequence number, increasing per Backend
  x-uuid: $uuid # A new UUID per request
server:
  http_version: http1 # http1 (HTTP/1.1) or http2; http2 requires cert_file and key_file and also answers HTTP/1.1 clients over TLS. Default: http1
  cert_file: "" # TLS certificate file; divisor serves TLS when both cert_file and key_file are set. Default: empty
  key_file: "" # TLS private key file for cert_file. Default: empty
  max_idle_worker_duration: 10s # How long an idle worker of the connection worker pool is kept. HTTP/1.1 path only. 0 or negative means the default. Default: 10 seconds
  tcp_keepalive_period: 15s # TCP keep-alive period for accepted client connections, on both paths. 0 or negative keeps Go's default. Default: 15 seconds (Go's default)
  concurrency: 262144 # Max client connections served at once. HTTP/1.1 path only. 0 or negative means the default. Default: 262144
  read_timeout: 0s # Time allowed to read a whole request, body included. 0 means unlimited. Default: unlimited
  write_timeout: 0s # Time allowed to write a response; a non-zero value also caps a whole Streamed response. 0 means unlimited. Default: unlimited
  idle_timeout: 0s # How long a keep-alive connection waits for its next request, idle HTTP/2 connections included. 0 means the value of read_timeout (unlimited when that is unset). Default: read_timeout
  proxy_timeout: 60s # Bound on each attempt at a Backend (dial and full round trip); expiry answers 504. For a Streamed response it bounds the time to the status and headers. 0 or negative means the default; there is no unlimited setting. Default: 60 seconds
  streaming: false # Forward a Backend response as its bytes arrive when it is text/event-stream or has no Content-Length; every other response is buffered. Default: false
  stream_idle_timeout: 5m # Ends a Streamed response after this long with no data from the Backend, or with a write to the client blocked (a client that stopped reading). 0 means the default; negative is a startup error; there is no unlimited setting. Default: 5 minutes
  max_request_body_size: 4194304 # Max request body in bytes; a larger body is answered 413 and never reaches a Backend. 0 or negative means the default. Default: 4194304 (4 MiB)
  read_buffer_size: 4096 # Per-connection read buffer in bytes; bounds request header size (raise it for large cookies/JWTs). HTTP/1.1 path only. 0 or negative means the default. Default: 4096
  write_buffer_size: 4096 # Per-connection write buffer in bytes. HTTP/1.1 path only. 0 or negative means the default. Default: 4096
  max_conns_per_ip: 0 # Max concurrent connections per Client IP. HTTP/1.1 path only. 0 or negative means unlimited. Default: unlimited
  max_requests_per_conn: 0 # Max requests served on one keep-alive connection before it is closed. HTTP/1.1 path only. 0 or negative means unlimited. Default: unlimited
  graceful_shutdown_timeout: 30s # Budget for draining in-flight requests on SIGINT/SIGTERM; hitting it exits with status 1. 0 means the default; negative is a startup error. Default: 30 seconds
  tls_min_version: "" # Minimum accepted TLS version; "1.2" or "1.3". Empty keeps the runtime default; only matters when TLS is served. Default: empty
  dns_cache_duration: 60s # How long a resolved Backend IP is reused, by the proxy and by Probes. Set a few seconds when Backend IPs churn, e.g. Kubernetes pods. 0 means the default; negative is a startup error. Default: 60 seconds
  disable_keepalive: false # Close each client connection after its first response. Default: false
  http2: # HTTP/2 server tuning. HTTP/2 path only; idle HTTP/2 connections follow idle_timeout
    max_concurrent_streams: 250 # Max concurrent streams a client may open per HTTP/2 connection. 0 or negative means the default; above 2147483647 is a startup error. Default: 250
