# HAProxy in the Equivalent setup (benchmark/README.md). No log lines, so
# nothing is logged; keep-alive and connection reuse stay at their defaults.
global
    nbthread 1

defaults
    mode http
    # HAProxy warns at startup without these; none is reached in a run.
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend benchmark
    bind :8080
    default_backend benchmark_backends

backend benchmark_backends
    balance roundrobin
    option forwardfor
    default-server check inter 30s
    server backend-1 127.0.0.1:9001
    server backend-2 127.0.0.1:9002
    server backend-3 127.0.0.1:9003
    server backend-4 127.0.0.1:9004
