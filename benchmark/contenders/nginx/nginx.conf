# nginx in the Equivalent setup (benchmark/README.md). Everything not set here
# is nginx's default.
worker_processes 1;

events {
}

http {
    access_log off;

    upstream benchmark_backends {
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;
        server 127.0.0.1:9004;
        # Idle connections kept open to the backends: at least the
        # Throughput Workload's 64 connections (nginx's default is 32).
        keepalive 64;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://benchmark_backends;
            # Upstream keep-alive needs HTTP/1.1 and no "Connection: close":
            # nginx's default since 1.29.7, explicit for any older pin.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
